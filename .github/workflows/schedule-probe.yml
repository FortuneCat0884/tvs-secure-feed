name: Scheduler diagnostic

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduler event
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
